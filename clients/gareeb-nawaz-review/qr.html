<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#173d32"><title>Gareeb Nawaz | Review QR</title><style>
*{box-sizing:border-box}body{margin:0;padding:22px;background:#f3f5f2;color:#1d2822;font-family:system-ui,Arial,sans-serif;display:grid;place-items:center;min-height:100vh}main{width:min(100%,500px);background:#fff;border:1px solid #e2e8e2;border-radius:20px;padding:26px;text-align:center;box-shadow:0 16px 45px #102b1c12}h1{font-size:24px;margin:0 0 8px;color:#173d32}.muted{color:#68766e;font-size:14px;line-height:1.5}#qr{margin:22px auto 14px;width:280px;min-height:280px;display:grid;place-items:center;padding:14px;background:#fff;border:1px solid #e5e9e5;border-radius:12px}#qr img,#qr canvas{max-width:100%;height:auto!important}button{width:100%;padding:14px;border:0;border-radius:11px;background:#173d32;color:#fff;font-size:15px;font-weight:700;margin-top:10px}button:disabled{opacity:.5}.note{font-size:12px;color:#7a857e;line-height:1.55;margin-top:16px}</style></head><body><main><h1>Gareeb Nawaz Restaurant Gulmarg</h1><p class="muted">Google Review QR Code</p><div id="qr" role="img" aria-label="Google review QR code">Preparing QR code…</div><button id="download" disabled>Download Review QR as PNG</button><p id="status" class="note" role="status">Loading QR code. Test it with another phone before printing.</p><p class="note">Main Market, Gulmarg Road, near J&amp;K Bank · +91 70064 60130</p></main><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script><script>
const reviewUrl="https://search.google.com/local/writereview?placeid=ChIJrwguek2v4TgRHRmwAN6NjwM",box=document.getElementById("qr"),btn=document.getElementById("download"),status=document.getElementById("status");
if(typeof QRCode==="undefined"){box.textContent="QR library unavailable. Check internet and reload.";status.textContent="QR not ready. Do not print yet.";}else{try{new QRCode(box,{text:reviewUrl,width:250,height:250,colorDark:"#111111",colorLight:"#ffffff",correctLevel:QRCode.CorrectLevel.H});btn.disabled=false;status.textContent="QR generated. Scan-test with a second phone before printing.";}catch(e){box.textContent="Could not generate QR.";status.textContent="QR not ready. Reload and try again.";}}
btn.addEventListener("click",()=>{const canvas=box.querySelector("canvas"),img=box.querySelector("img"),data=canvas?canvas.toDataURL("image/png"):img?.src;if(!data){status.textContent="QR is not ready yet.";return;}const a=document.createElement("a");a.href=data;a.download="gareeb-nawaz-gulmarg-google-review-qr.png";a.click();});
</script></body></html>
