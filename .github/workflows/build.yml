name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q "NamazGuard (1).zip"
      - run: |
          cp patches/HomeActivity.kt NamazGuard/app/src/main/java/com/me/blocker/HomeActivity.kt
          cp patches/BlockerAccessibilityService.kt NamazGuard/app/src/main/java/com/me/blocker/BlockerAccessibilityService.kt
          cp patches/accessibility_config.xml NamazGuard/app/src/main/res/xml/accessibility_config.xml
          python3 patches/apply_main_ui.py
          python3 patches/apply_prayer_update.py
      - uses: actions/upload-artifact@v4
        with:
          name: NamazGuard-source-inspection
          path: NamazGuard/
          if-no-files-found: error
          retention-days: 1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - run: cd NamazGuard && gradle assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: NamazGuard-apk
          path: NamazGuard/app/build/outputs/apk/debug/*.apk
