name: Unzip
on: workflow_dispatch
permissions:
  contents: write
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          unzip -q DisciplineGuard_v4.zip -x "DisciplineGuard/.github/*"
          cp -a DisciplineGuard/. .
          rm -rf DisciplineGuard DisciplineGuard_v4.zip
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Extract project"
          git push
